<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Aid AI Chatbot</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f2f6f9;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 30px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-box {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      max-width: 80%;
    }

    .user {
      background: #d1e7dd;
      margin-left: auto;
    }

    .bot {
      background: #f8d7da;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      background: #0d6efd;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🩺 First Aid AI Assistant</h1>
    <p>Basic Medical Support Chatbot</p>
  </div>

  <div class="chat-box" id="chatBox">

    <div class="message bot">
      Hello 👋<br><br>
      I am your First Aid AI Assistant.<br>
      Ask me about burns, cuts, fever, headache, bleeding, or minor injuries.
    </div>

  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask your question here...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

// =========================================
// OFFLINE AI FIRST AID CHATBOT
// =========================================

async function sendMessage() {

  let input = document.getElementById("userInput");
  let message = input.value.trim();

  if(message === "") return;

  let chatBox = document.getElementById("chatBox");

  // USER MESSAGE
  let userDiv = document.createElement("div");
  userDiv.className = "message user";
  userDiv.innerHTML = message;
  chatBox.appendChild(userDiv);

  input.value = "";

  // BOT TYPING MESSAGE
  let botDiv = document.createElement("div");
  botDiv.className = "message bot";
  botDiv.innerHTML = "🤖 AI Assistant is typing...";
  chatBox.appendChild(botDiv);

  chatBox.scrollTop = chatBox.scrollHeight;

  // AI THINKING EFFECT
  await new Promise(resolve => setTimeout(resolve, 1200));

  let aiReply = generateAIResponse(message);

  botDiv.innerHTML = aiReply;

  chatBox.scrollTop = chatBox.scrollHeight;
}

// =========================================
// SMART AI RESPONSE ENGINE
// =========================================

function generateAIResponse(message) {

  let text = message.toLowerCase();

  // ACCIDENT
  if(text.includes("accident") || text.includes("car crash") || text.includes("bike accident")) {

    return `🚨 <b>Emergency First Aid Guidance</b><br><br>

    1. Check if the person is breathing.<br>
    2. Call emergency ambulance immediately.<br>
    3. Do not move injured person unnecessarily.<br>
    4. Stop bleeding using clean cloth.<br>
    5. Keep patient calm until help arrives.<br><br>

    ⚠️ Serious accidents require immediate hospital treatment.`;
  }

  // FEVER
  else if(text.includes("fever") || text.includes("temperature") || text.includes("high fever")) {

    return `🌡️ <b>Fever First Aid</b><br><br>

    • Drink plenty of water.<br>
    • Take proper rest.<br>
    • Use light clothing.<br>
    • Monitor body temperature regularly.<br><br>

    If fever continues for more than 2 days, consult a doctor.`;
  }

  // BURNS
  else if(text.includes("burn") || text.includes("fire burn")) {

    return `🔥 <b>Burn Treatment</b><br><br>

    1. Cool the burn under running water for 10 minutes.<br>
    2. Do not apply ice directly.<br>
    3. Cover with clean cloth or bandage.<br><br>

    ⚠️ Severe burns need medical attention immediately.`;
  }

  // CUTS
  else if(text.includes("cut") || text.includes("bleeding") || text.includes("blood")) {

    return `🩹 <b>Cut & Bleeding First Aid</b><br><br>

    • Clean wound using clean water.<br>
    • Apply pressure to stop bleeding.<br>
    • Use antiseptic and bandage.<br><br>

    If bleeding is heavy, visit hospital immediately.`;
  }

  // FRACTURE
  else if(text.includes("fracture") || text.includes("bone") || text.includes("broken arm") || text.includes("broken leg")) {

    return `🦴 <b>Fracture First Aid</b><br><br>

    • Do not move injured part.<br>
    • Use support or splint.<br>
    • Apply ice pack carefully.<br><br>

    ⚠️ Visit nearest hospital immediately.`;
  }

  // HEADACHE
  else if(text.includes("headache") || text.includes("migraine")) {

    return `🤕 <b>Headache Care</b><br><br>

    • Rest in quiet room.<br>
    • Drink water properly.<br>
    • Avoid stress and screen brightness.<br><br>

    If headache becomes severe, consult doctor.`;
  }

  // CHEST PAIN
  else if(text.includes("chest pain") || text.includes("heart pain")) {

    return `❤️ <b>Chest Pain Emergency</b><br><br>

    • Keep patient calm.<br>
    • Loosen tight clothes.<br>
    • Call emergency services immediately.<br><br>

    ⚠️ Chest pain can be life-threatening.`;
  }

  // SNAKE BITE
  else if(text.includes("snake") || text.includes("snake bite")) {

    return `🐍 <b>Snake Bite First Aid</b><br><br>

    • Keep patient calm.<br>
    • Do not suck venom.<br>
    • Keep affected area still.<br>
    • Reach hospital immediately.`;
  }

  // ELECTRIC SHOCK
  else if(text.includes("electric shock") || text.includes("shock")) {

    return `⚡ <b>Electric Shock Treatment</b><br><br>

    • Turn off electricity source first.<br>
    • Do not touch victim directly.<br>
    • Check breathing and pulse.<br>
    • Call emergency services.`;
  }

  // FOOD POISONING
  else if(text.includes("vomiting") || text.includes("food poisoning") || text.includes("nausea")) {

    return `🤢 <b>Food Poisoning Care</b><br><br>

    • Drink clean fluids slowly.<br>
    • Avoid oily food.<br>
    • Take rest.<br><br>

    If symptoms become severe, consult doctor.`;
  }

  // FALLBACK AI RESPONSE
  else {

    let responses = [

      `🤖 <b>AI Medical Assistant</b><br><br>
      I understand your medical concern. Please monitor symptoms carefully and follow proper first aid precautions. If the condition becomes serious, consult a healthcare professional immediately.`,

      `⚕️ <b>AI Healthcare Guidance</b><br><br>
      Based on your question, basic first aid and proper monitoring are recommended. Serious symptoms should always be checked by a doctor.`,

      `🩺 <b>First Aid Recommendation</b><br><br>
      Stay calm, monitor symptoms carefully, and provide immediate basic care if necessary. Professional medical consultation is advised for severe conditions.`

    ];

    return responses[Math.floor(Math.random() * responses.length)];
  }
}

// =========================================
// ENTER KEY SUPPORT
// =========================================

document.getElementById("userInput")
.addEventListener("keypress", function(event) {

  if(event.key === "Enter") {
    sendMessage();
  }
});

</script>

</body>
</html>
