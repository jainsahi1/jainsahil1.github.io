<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Aid AI Chatbot</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f2f6f9;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 30px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-box {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      max-width: 80%;
    }

    .user {
      background: #d1e7dd;
      margin-left: auto;
    }

    .bot {
      background: #f8d7da;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      background: #0d6efd;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🩺 First Aid AI Assistant</h1>
    <p>Basic Medical Support Chatbot</p>
  </div>

  <div class="chat-box" id="chatBox">

    <div class="message bot">
      Hello 👋<br><br>
      I am your First Aid AI Assistant.<br>
      Ask me about burns, cuts, fever, headache, bleeding, or minor injuries.
    </div>

  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask your question here...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

// =============================
// ADD YOUR GEMINI API KEY HERE
// =============================

const API_KEY = "AIzaSyDrvUSHiFFqH35uv7s1zrP4VqqQA3kPgrE";

async function sendMessage() {

  let input = document.getElementById("userInput");
  let message = input.value.trim();

  if(message === "") {
    return;
  }

  let chatBox = document.getElementById("chatBox");

  // User Message
  let userDiv = document.createElement("div");
  userDiv.className = "message user";
  userDiv.innerHTML = message;
  chatBox.appendChild(userDiv);

  input.value = "";

  // Loading message
  let loadingDiv = document.createElement("div");
  loadingDiv.className = "message bot";
  loadingDiv.innerHTML = "🤖 AI Assistant is typing...";
  chatBox.appendChild(loadingDiv);

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: `
                  You are an AI First Aid Medical Assistant.

                  Give safe and beginner-friendly first aid guidance.

                  Rules:
                  - Keep responses short.
                  - Explain in simple language.
                  - Suggest doctor consultation for serious issues.
                  - Focus only on first aid and healthcare.

                  User Question: ${message}
                  `
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    let aiReply = data.candidates[0].content.parts[0].text;

    loadingDiv.innerHTML = aiReply.replace(/\n/g, "<br>");

  }
  catch(error) {

    loadingDiv.innerHTML = "⚠️ Error connecting to AI service. Please check your API key or internet connection.";

    console.log(error);
  }

  chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
